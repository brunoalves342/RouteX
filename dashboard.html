<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteX — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --accent:#60a5fa;--accent2:#818cf8;--green:#34d399;--red:#f87171;--yellow:#fbbf24;
  --text:#f0f4ff;--text2:#94a3b8;
  --glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.10);
  --input-bg:rgba(0,0,0,0.25);--radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#060a18;color:var(--text);overflow:hidden;}

/* SCROLLBAR PERSONALIZADO — GLOBAL */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#3b6ef0,#818cf8);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#60a5fa,#a78bfa);}
::-webkit-scrollbar-corner{background:transparent;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 70% 60% at 10% 10%,rgba(56,100,220,0.35) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 90% 80%,rgba(99,60,220,0.25) 0%,transparent 55%),
  #060a18;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb1{width:400px;height:400px;background:rgba(56,100,220,0.2);top:-100px;left:-100px;}
.orb2{width:300px;height:300px;background:rgba(120,60,240,0.15);bottom:0;right:0;}

/* LAYOUT */
.app{position:relative;z-index:1;display:grid;grid-template-columns:220px 1fr;height:100vh;}

/* SIDEBAR */
.sidebar{background:rgba(6,10,24,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--glass-border);}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#3b6ef0,#818cf8);
  border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 14px rgba(59,110,240,0.45);margin-bottom:10px;}
.logo-title{font-size:18px;font-weight:800;letter-spacing:-0.4px;}
.logo-sub{font-size:11px;font-weight:500;color:var(--text2);margin-top:2px;}

.nav-section{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:0.8px;padding:16px 20px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:600;
  color:var(--text2);cursor:pointer;border-left:2px solid transparent;transition:all 0.15s;}
.nav-item:hover{color:var(--text);background:var(--glass);}
.nav-item.active{color:var(--accent);background:rgba(96,165,250,0.08);border-left-color:var(--accent);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}

.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--glass-border);}
.btn-sair{width:100%;background:rgba(248,113,113,0.12);color:var(--red);
  border:1px solid rgba(248,113,113,0.25);border-radius:10px;padding:10px;
  font-size:13px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;}

/* LOGIN */
.login-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(6,10,24,0.95);backdrop-filter:blur(10px);}
.login-card{width:340px;background:rgba(255,255,255,0.05);backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);border-radius:24px;padding:32px;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);}
.login-logo{width:60px;height:60px;background:linear-gradient(135deg,#3b6ef0,#818cf8);
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 16px;box-shadow:0 4px 20px rgba(59,110,240,0.5);}
.login-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px;}
.login-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
.login-input{width:100%;background:rgba(0,0,0,0.3);border:1.5px solid var(--glass-border);
  border-radius:12px;padding:12px 14px;color:var(--text);font-size:15px;font-weight:500;
  font-family:'Inter',sans-serif;outline:none;margin-bottom:12px;-webkit-appearance:none;}
.login-input:focus{border-color:rgba(96,165,250,0.55);}
.login-input::placeholder{color:rgba(148,163,184,0.3);}
.btn-login{width:100%;background:linear-gradient(135deg,#3b6ef0,#818cf8);color:#fff;
  border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;
  font-family:'Inter',sans-serif;cursor:pointer;margin-top:4px;}
.login-err{font-size:12px;font-weight:600;color:var(--red);text-align:center;min-height:16px;margin-top:6px;}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;}
.topbar{flex-shrink:0;padding:20px 28px;background:rgba(6,10,24,0.5);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-size:18px;font-weight:800;letter-spacing:-0.4px;}
.topbar-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge-user{background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.2);
  border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--accent);}
.btn-refresh{background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;
  padding:8px 14px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;
  font-family:'Inter',sans-serif;}
.btn-refresh:hover{background:rgba(255,255,255,0.08);}

.content{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-track{background:transparent;}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}

/* FILTROS */
.filters{display:flex;gap:8px;}
.filter-btn{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;
  padding:6px 16px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;
  font-family:'Inter',sans-serif;transition:all 0.15s;}
.filter-btn.active{background:rgba(96,165,250,0.15);border-color:rgba(96,165,250,0.3);color:var(--accent);}

/* MÉTRICAS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.metric{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);
  border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);}
.metric-icon{font-size:22px;margin-bottom:10px;}
.metric-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;}
.metric-val{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1;}
.metric-sub{font-size:11px;font-weight:600;margin-top:6px;}
.up{color:var(--green);}
.metric-val.green{background:linear-gradient(135deg,#34d399,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);
  border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);}
.card-title{font-size:13px;font-weight:700;letter-spacing:-0.2px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;}
.card-title span{font-size:11px;font-weight:500;color:var(--text2);}

/* GRÁFICO */
.chart-wrap{position:relative;height:160px;}

/* ENTREGADORES */
.ent-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.ent-row:last-child{border:none;padding-bottom:0;}
.ent-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.ent-info{flex:1;min-width:0;}
.ent-name{font-size:13px;font-weight:700;}
.ent-detail{font-size:11px;color:var(--text2);margin-top:1px;}
.ent-taxa{font-size:15px;font-weight:800;color:var(--green);}

/* TOTAL DIA */
.total-dia{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.18);
  border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;
  align-items:center;margin-top:10px;}
.total-dia-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
.total-dia-val{font-size:20px;font-weight:900;color:var(--green);letter-spacing:-0.5px;}

/* TOP ENDEREÇOS */
.end-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.end-row:last-child{border:none;}
.end-rank{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:rgba(96,165,250,0.12);color:var(--accent);flex-shrink:0;}
.end-name{flex:1;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.end-bar-wrap{width:80px;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;}
.end-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,#3b6ef0,#818cf8);}
.end-count{font-size:11px;font-weight:700;color:var(--text2);width:28px;text-align:right;}
.end-taxa{font-size:11px;font-weight:700;color:var(--green);width:44px;text-align:right;}

/* HISTÓRICO DIAS */
.hist-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;}
.hist-row:last-child{border:none;}
.hist-row:hover .hist-date{color:var(--accent);}
.hist-date{font-size:13px;font-weight:700;}
.hist-info{font-size:11px;color:var(--text2);margin-top:2px;}
.hist-total{font-size:14px;font-weight:800;color:var(--green);}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:32px;
  color:var(--text2);font-size:13px;font-weight:600;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:rgba(10,15,35,0.95);
  backdrop-filter:blur(16px);border:1px solid var(--glass-border);color:var(--text);
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;
  font-family:'Inter',sans-serif;z-index:200;opacity:0;transition:all 0.22s;
  pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.toast.show{opacity:1;}

/* MODAL DETALHE */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;
  pointer-events:none;transition:opacity 0.2s;}
.modal-bg.show{opacity:1;pointer-events:all;}
.modal-box{background:rgba(8,13,30,0.97);backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:28px;
  width:480px;max-width:90vw;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);}
.modal-box::-webkit-scrollbar{width:4px;}
.modal-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:0.6px;margin-bottom:6px;}
.modal-input{width:100%;background:rgba(0,0,0,0.3);border:1.5px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-weight:600;
  font-family:'Inter',sans-serif;outline:none;-webkit-appearance:none;}
.modal-input:focus{border-color:rgba(96,165,250,0.5);}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-save{flex:1;background:linear-gradient(135deg,#3b6ef0,#818cf8);color:#fff;border:none;
  border-radius:10px;padding:11px;font-size:13px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;}
.btn-cancel{background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:11px 18px;font-size:13px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;}
.btn-delete{background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.2);
  border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;}

/* PERFIS */
.perfil-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;padding:16px;margin-bottom:10px;}
.perfil-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.perfil-nome{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.perfil-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
.perfil-badge.adm{background:rgba(251,191,36,0.15);color:var(--yellow);}
.perfil-badge.supervisor{background:rgba(96,165,250,0.15);color:var(--accent);}
.perfil-badge.entregador{background:rgba(52,211,153,0.15);color:var(--green);}
.perfil-info{display:flex;gap:16px;margin-bottom:12px;}
.perfil-dado{font-size:12px;color:var(--text2);}
.perfil-dado span{color:var(--text);font-weight:700;}
.btn-edit-sm{background:rgba(96,165,250,0.12);color:var(--accent);border:1px solid rgba(96,165,250,0.2);
  border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;}
.edit-senha-form{display:none;border-top:1px solid rgba(255,255,255,0.07);padding-top:12px;margin-top:4px;}
.edit-senha-row{display:flex;gap:8px;align-items:center;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">🗺️</div>
    <div class="login-title">RouteX Dashboard</div>
    <div class="login-sub">Acesso exclusivo ADM</div>
    <div>
      <div class="login-label">Login</div>
      <input class="login-input" type="text" id="loginNome" placeholder="Seu login" autocomplete="off" />
    </div>
    <div>
      <div class="login-label">Senha</div>
      <div style="position:relative;">
        <input class="login-input" type="password" id="loginSenha" placeholder="••••••" style="padding-right:44px;margin-bottom:0;" />
        <button onclick="toggleSenhaLogin()" type="button"
          style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
          background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;">👁️</button>
      </div>
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="appWrap" style="display:none;">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🗺️</div>
      <div class="logo-title">RouteX</div>
      <div class="logo-sub">Dashboard ADM</div>
    </div>

    <div class="nav-section">Menu</div>
    <div class="nav-item active" id="nav_visao" onclick="setPage('visao')">

      Visão geral
    </div>
    <div class="nav-item" id="nav_entregadores" onclick="setPage('entregadores')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>
      Entregadores
    </div>
    <div class="nav-item" id="nav_historico" onclick="setPage('historico')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Histórico
    </div>
    <div class="nav-item" id="nav_enderecos" onclick="setPage('enderecos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Endereços
    </div>
    <div class="nav-section">Configurações</div>
    <div class="nav-item" id="nav_perfis" onclick="setPage('perfis')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/><path d="M17 16l2 2 4-4"/></svg>

    <div class="sidebar-footer">
      <button class="btn-sair" onclick="sair()">Sair</button>

  <!-- MAIN -->
  <div class="main">

      <div>
        <div class="topbar-title" id="pageTitle">Visão geral</div>
        <div class="topbar-sub" id="pageDate"></div>

        <div class="badge-user" id="badgeUser"></div>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Atualizar</button>
      </div>

    <div class="content" id="content">
      <div class="loading">Carregando...</div>
    </div>
  </div>
</div>

<script>
// ── Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyC2H6o0S4oit32IiBQyt4-SM3VFqjvqL2I",
  authDomain: "fatimaentregas-1022.firebaseapp.com",
  databaseURL: "https://fatimaentregas-1022-default-rtdb.firebaseio.com",
  projectId: "fatimaentregas-1022",
  storageBucket: "fatimaentregas-1022.firebasestorage.app",
  messagingSenderId: "509143838146",
  appId: "1:509143838146:web:fcffed5c1fbeb880127a5b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── Usuários ──
const USUARIOS = {
  'adm':   { senha:'Macaco22', tipo:'adm' },
  'Andre': { senha:'adm2006',  tipo:'supervisor' },
};

const ENTREGADORES = ['Bruno','Jonathas'];

let usuarioAtual = null;
let paginaAtual  = 'visao';
let allData      = {};
let chartInstance = null;
let filtroMeses  = 1;

// ── Utils ──
function fmt(v){ return 'R$ '+parseFloat(v||0).toFixed(2).replace('.',','); }
function hoje(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtData(s){ const [y,m,d]=s.split('-'); const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return `${d} ${M[parseInt(m)-1]} ${y}`; }
function fmtHora(ts){ const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }

function inicioMesFiltro(){
  const d = new Date();
  const m = d.getMonth() - (filtroMeses - 1);
  const ano = d.getFullYear() + Math.floor(m/12);
  const mes = ((m%12)+12)%12;
  return `${ano}-${String(mes+1).padStart(2,'0')}-01`;
}

function semAcento(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── Login ──
function toggleSenhaLogin(){
  const i=document.getElementById('loginSenha');
  i.type=i.type==='password'?'text':'password';
}

function fazerLogin(){
  const nome  = document.getElementById('loginNome').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const err   = document.getElementById('loginErr');
  const user  = Object.keys(USUARIOS).find(k=>k.toLowerCase()===nome.toLowerCase());
  if(!user||USUARIOS[user].senha!==senha){ err.textContent='Login ou senha incorretos.'; return; }
  if(USUARIOS[user].tipo==='entregador'){ err.textContent='Acesso não permitido.'; return; }
  err.textContent='';
  usuarioAtual=user;
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('appWrap').style.display='grid';
  document.getElementById('badgeUser').textContent='⚙️ '+user;
  document.getElementById('pageDate').textContent=fmtData(hoje());
  carregarDados();
}

document.getElementById('loginNome').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('loginSenha').focus(); });
document.getElementById('loginSenha').addEventListener('keydown',e=>{ if(e.key==='Enter') fazerLogin(); });

function sair(){
  usuarioAtual=null; allData={};
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('appWrap').style.display='none';
  document.getElementById('loginNome').value='';
  document.getElementById('loginSenha').value='';
}

// ── Carregar dados ──
async function carregarDados(){
  document.getElementById('content').innerHTML='<div class="loading">🔄 Carregando dados...</div>';
  const snap = await db.ref('entregas').once('value');
  allData = snap.val()||{};

// ── Navegação ──
function setPage(p){
  paginaAtual=p;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl = document.getElementById('nav_'+p);
  if(navEl) navEl.classList.add('active');
  const titles={visao:'Visão geral',entregadores:'Entregadores',enderecos:'Endereços',historico:'Histórico',perfis:'Gestão de Perfis'};
  document.getElementById('pageTitle').textContent=titles[p]||p;
  renderPagina();
}

function renderPagina(){
  if(paginaAtual==='visao')           renderVisao();
  else if(paginaAtual==='entregadores') renderEntregadores();
  else if(paginaAtual==='enderecos')    renderEnderecosEdit();
  else if(paginaAtual==='historico')    renderHistorico();
  else if(paginaAtual==='perfis')       renderPerfis();
}

// ── Pega entregas de um user (com aliases) ──
function getEntregasUser(user){
  const aliases = { 'Jonathas':['Jonathas','Entregador2'], 'Bruno':['Bruno'] };
  const keys = aliases[user]||[user];
  const result={};
  keys.forEach(k=>{ if(allData[k]) Object.assign(result,allData[k]); });
  return result;
}

function getTodasEntregas(){
  // todas de todos os entregadores por dia
  const dias={};
  ENTREGADORES.forEach(u=>{
    const userDias=getEntregasUser(u);
    Object.entries(userDias).forEach(([dia,ents])=>{
      if(!dias[dia]) dias[dia]={};
      Object.values(ents).forEach(e=>{ if(e&&e.id) dias[dia][e.id]={...e,_user:u}; });
    });
  });
  return dias;
}

// ── MODAL DETALHE ENTREGA ──
let _mdEntrega = null;

function abrirDetalhe(entrega, user, dia){
  _mdEntrega = { ...entrega, _user: user, _dia: dia };
  document.getElementById('mdTitle').textContent = `Entrega #${entrega.id||''}`;
  document.getElementById('mdSub').textContent = `${user} · ${fmtData(dia)} · ${fmtHora(entrega.ts||0)}`;
  document.getElementById('mdRua').value    = entrega.rua||'';
  document.getElementById('mdNumero').value = entrega.numero||'';
  document.getElementById('mdTaxa').value   = entrega.taxa||'';
  document.getElementById('modalDetalhe').classList.add('show');
}

function fecharModal(ev){
  if(!ev || ev.target===document.getElementById('modalDetalhe'))
    document.getElementById('modalDetalhe').classList.remove('show');
}

async function salvarEntrega(){
  if(!_mdEntrega) return;
  const novaRua   = document.getElementById('mdRua').value.trim();
  const novoNum   = document.getElementById('mdNumero').value.trim();
  const novaTaxa  = parseFloat(document.getElementById('mdTaxa').value);
  if(!novaRua){ toast('⚠️ Digite a rua!'); return; }
  if(isNaN(novaTaxa)){ toast('⚠️ Taxa inválida!'); return; }

  const path = `entregas/${_mdEntrega._user}/${_mdEntrega._dia}/${_mdEntrega.id}`;
  await db.ref(path).update({ rua: novaRua, numero: novoNum, taxa: novaTaxa });

  toast('✓ Entrega atualizada!');
  document.getElementById('modalDetalhe').classList.remove('show');
  await carregarDados();
}

async function excluirEntrega(){
  if(!_mdEntrega) return;
  if(!confirm(`Excluir entrega em ${_mdEntrega.rua}?`)) return;
  const path = `entregas/${_mdEntrega._user}/${_mdEntrega._dia}/${_mdEntrega.id}`;
  await db.ref(path).remove();
  toast('✓ Entrega excluída!');
  document.getElementById('modalDetalhe').classList.remove('show');
  await carregarDados();
}

                  background:linear-gradient(90deg,${cores[idx].grad});"></div>

        type:'bar',
        data:{
          labels:ultimos14.map(d=>d.label),

            backgroundColor:ultimos14.map(d=>

          maintainAspectRatio:false,

            legend:{display:false},

              borderColor:'rgba(255,255,255,0.1)',

          },
          scales:{

            y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#94a3b8',font:{size:9}},beginAtZero:true}

}

function renderEnderecos(){
  const todas=getTodasEntregas();
  const inicio=inicioMesFiltro();
  const diasFilt=Object.entries(todas).filter(([d])=>d>=inicio);

  const endMap={};
  diasFilt.forEach(([,ents])=>Object.values(ents).forEach(e=>{
    if(!e.rua) return;
    const k=semAcento(e.rua.trim())+'|'+(e.numero||'');
    if(!endMap[k]) endMap[k]={rua:e.rua.trim(),numero:e.numero||'S/N',taxa:e.taxa||0,count:0};
    endMap[k].count++;
    endMap[k].taxa=e.taxa||endMap[k].taxa;
  }));

  const sorted=Object.values(endMap).sort((a,b)=>b.count-a.count);
  const maxCount=sorted[0]?.count||1;

  document.getElementById('content').innerHTML=`
    <div class="filters">
      <button class="filter-btn ${filtroMeses===1?'active':''}" onclick="setFiltro(1)">Este mês</button>
      <button class="filter-btn ${filtroMeses===3?'active':''}" onclick="setFiltro(3)">3 meses</button>
      <button class="filter-btn ${filtroMeses===6?'active':''}" onclick="setFiltro(6)">6 meses</button>
      <button class="filter-btn ${filtroMeses===12?'active':''}" onclick="setFiltro(12)">Todos</button>
    </div>
    <div class="card">
      <div class="card-title">Todos os endereços <span>${sorted.length} endereços</span></div>
      <input type="text" id="buscaEnd" placeholder="Buscar endereço..."
        oninput="filtrarEnd(this.value)"
        style="width:100%;background:rgba(0,0,0,0.25);border:1.5px solid rgba(255,255,255,0.1);
        border-radius:10px;padding:10px 13px;color:#f0f4ff;font-size:13px;
        font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;-webkit-appearance:none;" />
      <div id="endList">
        ${sorted.map((e,i)=>`
          <div class="end-row">
            <div class="end-rank">${i+1}</div>
            <div class="end-name" style="font-size:13px;">${e.rua}, nº ${e.numero}</div>
            <div class="end-bar-wrap" style="width:120px;"><div class="end-bar" style="width:${Math.round(e.count/maxCount*100)}%"></div></div>
            <div class="end-count">${e.count}x</div>
            <div class="end-taxa" style="width:60px;">${fmt(e.taxa)}</div>
          </div>`).join('')}
      </div>
    </div>`;

  window._endSorted=sorted;
  window._endMax=maxCount;
}

function filtrarEnd(txt){
  const q=semAcento(txt.trim());
  const filtrados=q?window._endSorted.filter(e=>semAcento(e.rua).includes(q)||(e.numero+'').includes(q)):window._endSorted;
  document.getElementById('endList').innerHTML=filtrados.map((e,i)=>`
    <div class="end-row">
      <div class="end-rank">${i+1}</div>
      <div class="end-name" style="font-size:13px;">${e.rua}, nº ${e.numero}</div>
      <div class="end-bar-wrap" style="width:120px;"><div class="end-bar" style="width:${Math.round(e.count/window._endMax*100)}%"></div></div>
      <div class="end-count">${e.count}x</div>
      <div class="end-taxa" style="width:60px;">${fmt(e.taxa)}</div>
    </div>`).join('');
}

function filtrarDia(user){
  // Destaca card selecionado
  const todosCards = ['todos', ...ENTREGADORES];
  todosCards.forEach(u=>{
    const card = document.getElementById(`card_ent_${u}`);
    if(!card) return;
    if(u === user){
      card.style.borderWidth = '2px';
      card.style.borderColor = u==='todos' ? 'rgba(96,165,250,0.6)' : 'rgba(52,211,153,0.6)';
      card.style.boxShadow = u==='todos' ? '0 0 16px rgba(96,165,250,0.2)' : '0 0 16px rgba(52,211,153,0.2)';
      card.style.opacity = '1';
    } else {
      card.style.borderWidth = '1px';
      card.style.borderColor = u==='todos' ? 'rgba(96,165,250,0.18)' : 'rgba(52,211,153,0.18)';
      card.style.boxShadow = 'none';
      card.style.opacity = '0.5';
    }
  });

  // Filtra e renumera os itens
  const itens = document.querySelectorAll('.dia-item');
  let num = 1;
  itens.forEach(el=>{
    const show = user==='todos' || el.dataset.user===user;
    el.style.display = show ? 'flex' : 'none';
    if(show){
      // Atualiza o número do item
      const numEl = el.querySelector('.item-num');
      if(numEl) numEl.textContent = num++;
    }
  });

  // Atualiza label
  const visiveis = num - 1;
  const label = document.getElementById('labelFiltro');
  if(label) label.textContent = user==='todos' ? `${visiveis} no total` : `${visiveis} do ${user}`;
}

function salvarEdicaoPerfil(loginAntigo){
  const novoLogin = document.getElementById('editLogin').value.trim();
  const novaSenha = document.getElementById('editSenha').value.trim();
  const novoTipo  = document.getElementById('editTipo').value;
  const err = document.getElementById('editPerfilErr');

  if(!novoLogin){ err.textContent='⚠️ Digite um login!'; return; }
  if(!novaSenha){ err.textContent='⚠️ Digite uma senha!'; return; }
  if(novoLogin !== loginAntigo && _perfisDB[novoLogin]){ err.textContent='⚠️ Já existe um perfil com esse login!'; return; }

  const infoAntiga = _perfisDB[loginAntigo];
  const emojis = { adm:'⚙️', entregador:'🛵', supervisor:'👀' };

  // Remove o antigo e cria com novo login
  delete _perfisDB[loginAntigo];
  _perfisDB[novoLogin] = { senha: novaSenha, tipo: novoTipo, emoji: emojis[novoTipo] };

  // Atualiza lista de entregadores
  const idx = ENTREGADORES.indexOf(loginAntigo);
  if(infoAntiga.tipo==='entregador' && novoTipo!=='entregador'){
    if(idx!==-1) ENTREGADORES.splice(idx,1);
  } else if(novoTipo==='entregador' && !ENTREGADORES.includes(novoLogin)){
    if(idx!==-1) ENTREGADORES[idx]=novoLogin;
    else ENTREGADORES.push(novoLogin);
  } else if(idx!==-1 && novoLogin!==loginAntigo){
    ENTREGADORES[idx]=novoLogin;
  }

  document.getElementById('modalEditarPerfil').remove();
  toast(`✓ Perfil atualizado com sucesso!`);
  renderPerfis();
}

function fecharModalNovoPerfil(){

function criarNovoPerfil(){
  const login = document.getElementById('novoLogin').value.trim();
  const senha = document.getElementById('novaSenha').value.trim();
  const tipo  = document.getElementById('novoTipo').value;
  const err   = document.getElementById('novoPerfilErr');

  if(!login){ err.textContent='⚠️ Digite um login!'; return; }
  if(!senha){ err.textContent='⚠️ Digite uma senha!'; return; }
  if(_perfisDB[login]){ err.textContent='⚠️ Já existe um perfil com esse login!'; return; }

  const emojis = { entregador:'🛵', supervisor:'👀' };
  _perfisDB[login] = { senha, tipo, emoji: emojis[tipo] };

  // Atualiza ENTREGADORES se for entregador
  if(tipo==='entregador' && !ENTREGADORES.includes(login)) ENTREGADORES.push(login);

  toast(`✓ Perfil de ${login} criado!`);
  fecharModalNovoPerfil();
  _grupoAberto = tipo;
  renderPerfis();
}

function renderEnderecosEdit(){
  const todas = getTodasEntregas();
  const endMap = {};
  Object.values(todas).forEach(ents=>Object.values(ents).forEach(e=>{
    if(!e.rua) return;
    const k = semAcento(e.rua.trim())+'|'+(e.numero||'');
    if(!endMap[k]) endMap[k]={rua:e.rua.trim(),numero:e.numero||'S/N',taxa:e.taxa||0,count:0};
    endMap[k].count++;
    endMap[k].taxa=e.taxa||endMap[k].taxa;
  }));
  const sorted = Object.values(endMap).sort((a,b)=>b.count-a.count);

  let html = `
    <div class="filters">
      <button class="filter-btn active" style="cursor:default;">${sorted.length} endereços cadastrados</button>
    </div>
    <div class="card">
      <div class="card-title">Endereços <span>Clique em ✏️ para editar</span></div>
      <input type="text" id="buscaEndEdit" placeholder="Buscar endereço..."
        oninput="filtrarEndEdit(this.value)"
        style="width:100%;background:rgba(0,0,0,0.25);border:1.5px solid rgba(255,255,255,0.1);
        border-radius:10px;padding:10px 13px;color:#f0f4ff;font-size:13px;
        font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;-webkit-appearance:none;" />
      <div id="endEditList" style="max-height:calc(100vh - 280px);overflow-y:auto;padding-right:4px;">`;

  sorted.forEach((e,i)=>{
    html += `
      <div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:10px 0;" id="endEdit_${i}">
        <!-- View -->
        <div id="endView_${i}" style="display:flex;align-items:center;gap:10px;">
          <div class="end-rank">${i+1}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:700;">${e.rua}, nº ${e.numero}</div>
            <div style="font-size:11px;color:var(--text2);margin-top:2px;">${e.count}x entregue · ${fmt(e.taxa)}</div>
          </div>
          <button onclick="abrirEditEnd(${i})"
            style="background:rgba(96,165,250,0.12);color:var(--accent);border:1px solid rgba(96,165,250,0.2);
            border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;
            font-family:'Inter',sans-serif;cursor:pointer;">✏️</button>
        </div>
        <!-- Edit -->
        <div id="endForm_${i}" style="display:none;margin-top:10px;padding:12px;
          background:rgba(0,0,0,0.2);border-radius:10px;">
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px;">
            <div>
              <div class="modal-label">Rua</div>
              <input class="modal-input" id="endRua_${i}" value="${e.rua}" style="font-size:12px;padding:8px;" />
            </div>
            <div>
              <div class="modal-label">Número</div>
              <input class="modal-input" id="endNum_${i}" value="${e.numero}" style="font-size:12px;padding:8px;" />
            </div>
            <div>
              <div class="modal-label">Taxa</div>
              <input class="modal-input" type="number" id="endTaxa_${i}" value="${e.taxa}" step="0.50" style="font-size:12px;padding:8px;" />

          <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button class="btn-cancel" style="padding:8px 14px;font-size:12px;" onclick="fecharEditEnd(${i})">Cancelar</button>
            <button class="btn-save" style="padding:8px 14px;font-size:12px;" onclick="salvarEndEdit(${i},'${e.rua.replace(/'/g,"\\'")}','${e.numero}')">✓ Salvar</button>

function filtrarEndEdit(txt){
  const q = semAcento(txt.trim());
  document.querySelectorAll('[id^="endEdit_"]').forEach(el=>{
    const nome = el.querySelector('div[style*="font-size:13px"]')?.textContent||'';
    el.style.display = !q || semAcento(nome).includes(q) ? '' : 'none';
  });
}
function abrirEditEnd(i){
  document.getElementById(`endView_${i}`).style.display='none';
  document.getElementById(`endForm_${i}`).style.display='block';
}
function fecharEditEnd(i){
  document.getElementById(`endView_${i}`).style.display='flex';
  document.getElementById(`endForm_${i}`).style.display='none';
}
async function salvarEndEdit(i, ruaAntiga, numAntigo){
  const novaRua  = document.getElementById(`endRua_${i}`).value.trim();
  const novoNum  = document.getElementById(`endNum_${i}`).value.trim();
  const novaTaxa = parseFloat(document.getElementById(`endTaxa_${i}`).value);
  if(!novaRua||isNaN(novaTaxa)){ toast('⚠️ Preencha todos os campos!'); return; }

  toast('⏳ Atualizando...');
  const snap = await db.ref('entregas').once('value');
  const allD = snap.val()||{};
  const updates = {};
  Object.entries(allD).forEach(([user,dias])=>{
    Object.entries(dias).forEach(([dia,ents])=>{
      Object.entries(ents).forEach(([id,e])=>{
        if(!e||!e.rua) return;
        if(semAcento(e.rua.trim())===semAcento(ruaAntiga.trim()) && (e.numero||'').trim()===numAntigo.trim()){
          updates[`entregas/${user}/${dia}/${id}/rua`]    = novaRua;
          updates[`entregas/${user}/${dia}/${id}/numero`] = novoNum||e.numero;
          updates[`entregas/${user}/${dia}/${id}/taxa`]   = novaTaxa;
        }
      });
    });
  });
  if(Object.keys(updates).length){
    await db.ref().update(updates);
    toast(`✓ ${Object.keys(updates).length/3} entregas atualizadas!`);
  } else {
    toast('Nenhuma entrega encontrada.');
  }
  await carregarDados();
  renderEnderecosEdit();
}

  const meses={};

    if(!meses[chave]) meses[chave]={label:`${nomeMes[parseInt(m)-1]} ${y}`,ano:y,mes:m,dias:[]};

      <button class="filter-btn ${filtroMeses===6?'active':''}" onclick="setFiltro(6)">6 meses</button>
    </div>`;

  Object.entries(meses).sort(([a],[b])=>b.localeCompare(a)).forEach(([,mes])=>{
    const totalMes=mes.dias.reduce((s,[,ents])=>s+Object.values(ents).reduce((ss,e)=>ss+(e.taxa||0),0),0);
    const totalEnts=mes.dias.reduce((s,[,ents])=>s+Object.values(ents).length,0);

    html+=`
    <div style="margin-bottom:24px;">
      <!-- Cabeçalho do mês -->
      <div style="display:flex;align-items:center;justify-content:space-between;
        margin-bottom:10px;padding:0 4px;">

          <div style="width:3px;height:18px;background:linear-gradient(180deg,#3b6ef0,#818cf8);border-radius:2px;"></div>
          <div style="font-size:15px;font-weight:800;letter-spacing:-0.3px;">${mes.label}</div>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="font-size:12px;color:var(--text2);">${totalEnts} entregas</div>
          <div style="font-size:14px;font-weight:800;color:var(--green);">${fmt(totalMes)}</div>
        </div>
      </div>

      <!-- Dias do mês -->
      <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;">
        ${mes.dias.map(([dia,ents],idx)=>{
          const lista=Object.values(ents);
          const total=lista.reduce((s,e)=>s+(e.taxa||0),0);
          const porUser={};
          lista.forEach(e=>{ if(!porUser[e._user]) porUser[e._user]=0; porUser[e._user]+=(e.taxa||0); });
          const d=new Date(dia+'T12:00:00');
          const diaSemana=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];
          const isLast=idx===mes.dias.length-1;

          return `<div onclick="verDiaDetalhe('${dia}')"
            style="display:flex;align-items:center;gap:16px;padding:14px 18px;cursor:pointer;
            transition:background 0.12s;border-bottom:${isLast?'none':'1px solid rgba(255,255,255,0.05)'};"
            onmouseover="this.style.background='rgba(255,255,255,0.04)'"
            onmouseout="this.style.background='transparent'">

            <!-- Data -->
            <div style="width:48px;text-align:center;flex-shrink:0;">
              <div style="font-size:22px;font-weight:900;line-height:1;color:var(--text);">${String(d.getDate()).padStart(2,'0')}</div>

  });

  document.getElementById('content').innerHTML=html;
}

      <input class="modal-input" type="text" id="mdRua" />
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">Número</div>
        <input class="modal-input" type="text" id="mdNumero" />
      </div>
      <div class="modal-field">
        <div class="modal-label">Taxa (R$)</div>
        <input class="modal-input" type="number" id="mdTaxa" step="0.50" min="0" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" onclick="excluirEntrega()">🗑 Excluir</button>
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarEntrega()">✓ Salvar</button>
    </div>
  </div>
</div>
</body>
</html>
