<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RouteX">
<meta name="theme-color" content="#1a2dff">
<title>RouteX</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231a2dff'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23bg)'/%3E%3Ctext x='60' y='370' font-family='Arial Black,Arial' font-size='290' font-weight='900' fill='white'%3ERX%3C/text%3E%3Ccircle cx='400' cy='140' r='40' fill='%2334d399'/%3E%3Ccircle cx='400' cy='140' r='20' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231a2dff'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23bg)'/%3E%3Ctext x='60' y='370' font-family='Arial Black,Arial' font-size='290' font-weight='900' fill='white'%3ERX%3C/text%3E%3Ccircle cx='400' cy='140' r='40' fill='%2334d399'/%3E%3Ccircle cx='400' cy='140' r='20' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root {
    --accent:#60a5fa;--accent2:#818cf8;--green:#34d399;--red:#f87171;--yellow:#fbbf24;
    --text:#f0f4ff;--text2:#94a3b8;
    --glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.10);--glass-hover:rgba(255,255,255,0.08);
    --input-bg:rgba(0,0,0,0.25);--radius:20px;--radius-sm:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#060a18;color:var(--text);overflow:hidden;}
  .bg{position:fixed;inset:0;z-index:0;background:
    radial-gradient(ellipse 80% 60% at 20% 10%,rgba(56,100,220,0.35) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%,rgba(99,60,220,0.25) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 60% 30%,rgba(30,140,255,0.15) 0%,transparent 50%),#060a18;}
  .orb{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;}
  .orb1{width:260px;height:260px;background:rgba(56,100,220,0.28);top:-60px;left:-60px;}
  .orb2{width:200px;height:200px;background:rgba(120,60,240,0.2);bottom:80px;right:-40px;}

  .page{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
    max-width:430px;margin:0 auto;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .page.active{display:flex;}

  /* LOGIN */
  .login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .login-logo{width:72px;height:72px;background:linear-gradient(135deg,#3b6ef0,#818cf8);
    border-radius:22px;display:flex;align-items:center;justify-content:center;
    font-size:36px;box-shadow:0 8px 32px rgba(59,110,240,0.5);margin-bottom:20px;}
  .login-title{font-size:24px;font-weight:900;letter-spacing:-0.6px;margin-bottom:4px;}
  .login-sub{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:32px;}
  .login-card{width:100%;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;
    display:flex;flex-direction:column;gap:14px;
    box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.07);}
  .login-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:5px;}
  .login-input{background:var(--input-bg);border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);
    padding:13px 15px;color:var(--text);font-size:16px;font-weight:500;font-family:'Inter',sans-serif;
    outline:none;width:100%;-webkit-appearance:none;transition:border-color 0.15s;}
  .login-input:focus{border-color:rgba(96,165,250,0.55);}
  .login-input::placeholder{color:rgba(148,163,184,0.3);}
  .btn-login{background:linear-gradient(135deg,#3b6ef0,#818cf8);color:#fff;border:none;
    border-radius:var(--radius-sm);padding:15px;font-size:16px;font-weight:800;
    font-family:'Inter',sans-serif;cursor:pointer;
    box-shadow:0 4px 18px rgba(59,110,240,0.45);transition:opacity 0.15s,transform 0.1s;}
  .btn-login:active{opacity:0.85;transform:scale(0.99);}
  .login-err{font-size:12px;font-weight:600;color:var(--red);text-align:center;min-height:16px;}

  /* STATUS SYNC */
  .sync-bar{flex-shrink:0;padding:5px 18px;display:flex;align-items:center;gap:6px;
    font-size:11px;font-weight:600;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .sync-dot.online{background:var(--green);box-shadow:0 0 6px var(--green);}
  .sync-dot.offline{background:var(--yellow);box-shadow:0 0 6px var(--yellow);}
  .sync-dot.syncing{background:var(--accent);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  /* HEADER */
  .header{flex-shrink:0;padding:14px 18px 12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    background:rgba(6,10,24,0.5);border-bottom:1px solid var(--glass-border);}
  .header-row{display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#3b6ef0,#818cf8);
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:17px;box-shadow:0 4px 14px rgba(59,110,240,0.4);}
  .logo-text h1{font-size:15px;font-weight:800;letter-spacing:-0.4px;line-height:1.1;}
  .logo-text span{font-size:11px;font-weight:500;color:var(--text2);}
  .header-right{display:flex;gap:7px;align-items:center;}
  .btn-sair{background:rgba(248,113,113,0.12);color:var(--red);
    border:1px solid rgba(248,113,113,0.25);border-radius:9px;padding:7px 11px;
    font-size:11px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;}
  .btn-adm{background:rgba(251,191,36,0.12);color:var(--yellow);
    border:1px solid rgba(251,191,36,0.25);border-radius:9px;padding:7px 11px;
    font-size:11px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;}

  .fixed-area{flex-shrink:0;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px;}

  /* FORM */
  .form-card{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);border-radius:var(--radius);padding:13px;
    display:flex;flex-direction:column;gap:9px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.07);
    position:relative;overflow:hidden;}
  .form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);}
  .form-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;}
  .input-row{display:flex;gap:8px;align-items:flex-end;}
  .input-group{display:flex;flex-direction:column;gap:4px;flex:1;}
  .input-group.num-group{flex:0 0 90px;}
  .input-group.taxa-group{flex:0 0 120px;}
  .input-group label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;padding-left:3px;}
  .input-group input{background:var(--input-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);
    padding:11px 13px;color:var(--text);font-size:15px;font-weight:500;font-family:'Inter',sans-serif;
    outline:none;width:100%;-webkit-appearance:none;transition:border-color 0.15s,box-shadow 0.15s;}
  .input-group input:focus{border-color:rgba(96,165,250,0.55);box-shadow:0 0 0 3px rgba(96,165,250,0.09);}
  .input-group input::placeholder{color:rgba(148,163,184,0.3);}
  .taxa-preview{font-size:12px;font-weight:600;color:var(--green);flex:1;padding-left:6px;align-self:center;}
  /* AUTOCOMPLETE */
  #autocompleteList::-webkit-scrollbar{display:none;}
  .autocomplete-item{
    padding:12px 16px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.06);
    -webkit-tap-highlight-color:transparent;
  }
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:active{background:rgba(96,165,250,0.15);}
  .ac-rua{font-size:14px;font-weight:600;color:#f0f4ff;}
  .ac-info{font-size:11px;font-weight:500;color:#94a3b8;margin-top:3px;}
  .ac-taxa{font-size:12px;font-weight:700;color:#34d399;}
  .ac-hl{color:#60a5fa;font-weight:800;}

  .btn-add{background:linear-gradient(135deg,#3b6ef0,#818cf8);color:#fff;border:none;
    border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;font-weight:800;
    font-family:'Inter',sans-serif;cursor:pointer;
    box-shadow:0 4px 18px rgba(59,110,240,0.4);transition:opacity 0.15s,transform 0.1s;white-space:nowrap;}
  .btn-add:active{opacity:0.85;transform:scale(0.98);}

  /* STATS */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);border-radius:var(--radius);padding:13px 15px;
    display:flex;align-items:center;gap:11px;
    box-shadow:0 4px 16px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.07);
    position:relative;overflow:hidden;transition:transform 0.1s;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);}
  .stat-card.blue{border-color:rgba(96,165,250,0.18);cursor:pointer;}
  .stat-card.green{border-color:rgba(52,211,153,0.18);}
  .stat-card.blue:active{transform:scale(0.98);background:var(--glass-hover);}
  .stat-icon-box{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .blue .stat-icon-box{background:rgba(96,165,250,0.13);}
  .green .stat-icon-box{background:rgba(52,211,153,0.13);}
  .stat-info{display:flex;flex-direction:column;gap:2px;flex:1;}
  .stat-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;}
  .stat-value{font-size:22px;font-weight:900;letter-spacing:-0.8px;line-height:1;}
  .stat-value.money{font-size:18px;letter-spacing:-0.3px;
    background:linear-gradient(135deg,#34d399,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .stat-tap-hint{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
  .hint-text{font-size:10px;font-weight:600;color:rgba(96,165,250,0.5);}
  .hint-arrow{font-size:16px;color:rgba(96,165,250,0.3);}

  /* ADM */
  .adm-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .adm-scroll::-webkit-scrollbar{display:none;}
  .adm-section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;}

  /* ABAS ADM */
  .adm-tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(0,0,0,0.2);border-bottom:1px solid var(--glass-border);}
  .adm-tab{background:none;border:none;color:var(--text2);font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;padding:10px 4px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border-bottom:2px solid transparent;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
  .adm-tab span{font-size:10px;font-weight:700;letter-spacing:0.3px;}
  .adm-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .adm-tab:active{opacity:0.7;}

  /* PERFIL ITEM */
  .perfil-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
    border-radius:12px;padding:14px;margin-bottom:8px;}
  .perfil-item:last-child{margin-bottom:0;}
  .perfil-nome{font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px;
    display:flex;align-items:center;gap:8px;}
  .perfil-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .perfil-badge.adm{background:rgba(251,191,36,0.15);color:var(--yellow);}
  .perfil-badge.entregador{background:rgba(52,211,153,0.15);color:var(--green);}
  .perfil-badge.supervisor{background:rgba(96,165,250,0.15);color:var(--accent);}
  .perfil-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .perfil-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;
    letter-spacing:0.5px;width:52px;flex-shrink:0;}
  .perfil-val{font-size:13px;font-weight:600;color:var(--text);flex:1;}
  .perfil-edit-input{flex:1;background:rgba(0,0,0,0.3);border:1.5px solid rgba(96,165,250,0.4);
    border-radius:8px;padding:7px 10px;color:var(--text);font-size:13px;font-weight:600;
    font-family:'Inter',sans-serif;outline:none;-webkit-appearance:none;}
  .btn-perfil-salvar{background:linear-gradient(135deg,#3b6ef0,#818cf8);color:#fff;border:none;
    border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;
    font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap;}
  .btn-perfil-editar{background:rgba(96,165,250,0.12);color:var(--accent);
    border:1px solid rgba(96,165,250,0.2);border-radius:8px;padding:5px 10px;
    font-size:11px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-left:auto;}
  .adm-online-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .adm-ent-card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:13px;
    cursor:pointer;transition:transform 0.1s,background 0.15s;position:relative;overflow:hidden;}
  .adm-ent-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.09),transparent);}
  .adm-ent-card:active{transform:scale(0.98);background:var(--glass-hover);}
  .adm-ent-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:7px;}
  .adm-ent-card-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .adm-ent-card-qtd{font-size:11px;font-weight:600;color:var(--text2);}
  .adm-ent-card-taxa{font-size:16px;font-weight:900;color:var(--green);margin-top:4px;}
  .online-dot{width:8px;height:8px;background:var(--green);border-radius:50%;
    position:absolute;top:11px;right:11px;box-shadow:0 0 6px var(--green);}
  .adm-day-card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;
    margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;transition:background 0.15s;}
  .adm-day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);}
  .adm-day-card:active{background:var(--glass-hover);}
  .adm-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .adm-day-date{font-size:14px;font-weight:800;letter-spacing:-0.3px;}
  .adm-day-total{font-size:14px;font-weight:800;color:var(--green);}
  .adm-entregador-row{display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:10px;margin-bottom:5px;}
  .adm-ent-name{font-size:12px;font-weight:700;color:var(--text);}
  .adm-ent-info{font-size:10px;font-weight:500;color:var(--text2);margin-top:1px;}
  .adm-ent-taxa{font-size:13px;font-weight:800;color:var(--accent);}

  /* IMPRESSÃO / PDF (fechamento do mês) */
  @media print{
    body *{visibility:hidden !important;}
    #modalRelDia, #modalRelDia *{visibility:visible !important;}
    #modalRelDia{position:absolute !important;left:0;top:0;width:100%;height:auto !important;background:#fff !important;backdrop-filter:none !important;opacity:1 !important;display:block !important;}
    #modalRelDia .modal-sheet{height:auto !important;transform:none !important;box-shadow:none !important;border:none !important;background:#fff !important;padding:16px !important;}
    #modalRelDia *{color:#111 !important;background:transparent !important;border-color:#ccc !important;box-shadow:none !important;}
    #modalRelDia .hist-scroll{overflow:visible !important;height:auto !important;}
    .no-print, #modalRelDia .sheet-handle{display:none !important;}
  }

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);
    background:rgba(10,15,35,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:var(--text);border:1px solid var(--glass-border);padding:10px 22px;border-radius:30px;
    font-size:13px;font-weight:600;font-family:'Inter',sans-serif;
    opacity:0;transition:all 0.22s;z-index:300;white-space:nowrap;pointer-events:none;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.acao{pointer-events:all;}
  .toast-btn{margin-left:14px;background:rgba(96,165,250,0.16);color:var(--accent);border:1px solid rgba(96,165,250,0.35);border-radius:16px;padding:5px 14px;font-size:12.5px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;}

  /* MODALS */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.22s;}
  .modal-overlay.show{opacity:1;pointer-events:all;}
  .modal-sheet{background:rgba(8,13,30,0.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    border:1px solid var(--glass-border);border-bottom:none;border-radius:26px 26px 0 0;
    padding:16px 20px 24px;width:100%;
    height:85vh;
    display:flex;flex-direction:column;
    transform:translateY(100%);
    transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);box-shadow:0 -8px 40px rgba(0,0,0,0.5);}
  .modal-overlay.show .modal-sheet{transform:translateY(0);}
  /* DETALHE DA ENTREGA — cartão flutuante (não gruda embaixo, não é esmagado pelo teclado) */
  #modalDetalhe{align-items:center;justify-content:center;padding:16px;
    bottom:auto;height:100%;}   /* altura/posição ajustadas por JS conforme o teclado */
  #modalDetalhe .modal-sheet{height:auto;max-height:100%;max-width:440px;overflow-y:auto;overscroll-behavior:contain;
    border:1px solid var(--glass-border);border-radius:26px;padding:18px 20px 22px;
    transform:translateY(16px) scale(0.96);opacity:0;
    transition:transform 0.25s cubic-bezier(0.4,0,0.2,1),opacity 0.2s;
    box-shadow:0 24px 64px rgba(0,0,0,0.65);}
  #modalDetalhe.show .modal-sheet{transform:none;opacity:1;}
  #modalDetalhe .sheet-handle{display:none;}

// ── Segurança: senha guardada só como "hash" (ninguém consegue ler a senha no banco) ──
function sha256hex(str){
  const K=[],H=[]; for(let n=2,c=0;c<64;n++){ let p=true; for(let d=2;d*d<=n;d++) if(n%d===0){p=false;break;} if(p){ if(c<8) H[c]=(Math.pow(n,1/2)%1*4294967296)|0; K[c]=(Math.pow(n,1/3)%1*4294967296)|0; c++; } }
  const b=Array.from(new TextEncoder().encode(str)), bits=b.length*8;
  b.push(0x80); while(b.length%64!==56) b.push(0);
  b.push(0,0,0,0,(bits>>>24)&255,(bits>>>16)&255,(bits>>>8)&255,bits&255);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n)), w=new Array(64);
  for(let i=0;i<b.length;i+=64){
    for(let t=0;t<16;t++) w[t]=(b[i+t*4]<<24)|(b[i+t*4+1]<<16)|(b[i+t*4+2]<<8)|b[i+t*4+3];
    for(let t=16;t<64;t++){ const s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3), s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+w[t])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&bb)^(a&c)^(bb&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+bb)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function novoSalt(){ const a=new Uint8Array(8); (window.crypto||window.msCrypto).getRandomValues(a); return Array.from(a,x=>x.toString(16).padStart(2,'0')).join(''); }
function hashSenha(salt, senha){ return sha256hex('routex|'+salt+'|'+senha); }
function novaCredencial(senha){ const salt=novoSalt(); return { salt, hash:hashSenha(salt,senha) }; }
function senhaConfere(u, senha){
  if(!u) return false;
  if(u.hash) return hashSenha(u.salt||'', senha) === u.hash;
  return u.senhaLegada!=null && u.senhaLegada === senha;   // perfil antigo (ainda sem hash)
}

function protegerSenhas(){

function fmt(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }

// Escapa texto vindo do banco antes de colocar em innerHTML
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Codifica texto pra ir dentro de aspas simples num onclick="" (sem quebrar com ' " \ etc.)
function jsStr(s){
  return String(s==null?'':s).replace(/[^A-Za-z0-9_\-. ]/g, c=>{
    const n=c.charCodeAt(0);
    return n<256 ? '\\x'+n.toString(16).padStart(2,'0') : '\\u'+n.toString(16).padStart(4,'0');
  });
}
function removerAcentos(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
// "Rua", "Av.", "Avenida"... no começo (mas NÃO pega "Avelino", "Ruanda"...)
function temPrefixoLog(s){
  return /^(rua|av|avenida|alameda|travessa|praca|praça)(?![a-zA-Z\u00c0-\u00ff])/i.test((s||'').trim());
}
function fmtHora(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function hoje(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Retorna o primeiro dia do mês atual (ex: "2026-09-01")
function inicioMesAtual(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}

// Filtra dias que estão dentro do mês atual
function dentrodoMes(dia){
  return dia >= inicioMesAtual();
}
function fmtData(str){
  const [y,m,d] = str.split('-');
  const M = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${d} de ${M[parseInt(m)-1]} de ${y}`;
}

// ── Fila offline: a entrega fica guardada no celular até o servidor confirmar ──
const FILA_KEY = 'routex_fila_v1';
function filaLer(){ try{ const a=JSON.parse(localStorage.getItem(FILA_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function filaGravar(a){ try{ localStorage.setItem(FILA_KEY, JSON.stringify(a)); }catch(e){} setSyncStatus(_ultimoSync.status, _ultimoSync.text); }
function filaBuscar(path){ const x=filaLer().find(i=>i.path===path); return x ? x.ent : null; }
function filaRemover(path){ if(filaLer().some(i=>i.path===path)) filaGravar(filaLer().filter(i=>i.path!==path)); }
function salvarComFila(path, ent){
  const f = filaLer().filter(i=>i.path!==path); f.push({ path, ent }); filaGravar(f);
  return db.ref(path).set(ent).then(()=>filaRemover(path));   // só sai da fila quando o servidor confirma
}
const _filaEnviando = new Set();
function enviarFila(){
  filaLer().forEach(i=>{
    if(_filaEnviando.has(i.path)) return;
    _filaEnviando.add(i.path);
    db.ref(i.path).set(i.ent).then(()=>{ filaRemover(i.path); }).catch(err=>console.error('Firebase (fila):', err)).then(()=>_filaEnviando.delete(i.path));
  });
}

  const ref = db.ref(pathUser(usuarioAtual));

  ref.on('value', snap=>{
    const data = snap.val() || {};

    const prefixo = pathUser(usuarioAtual)+'/';
    const pend = filaLer().filter(i=>i.path.startsWith(prefixo) && i.ent && !data[String(i.ent.id)]).map(i=>i.ent);
    entregasLocal = [...Object.values(data), ...pend].filter(e=>e && e.ts).sort((a,b)=>a.ts-b.ts);
    atualizarStats();

    setSyncStatus('offline','⚠️ Sem acesso ao banco');
    toast('⚠️ Sem permissão no banco de dados');
  });

  unsubscribe = () => ref.off('value');
}

let enderecoHistorico = {};

// Normaliza o nome da rua removendo prefixos duplicados
function normalizarRua(rua){
  if(!rua) return '';
  return rua.trim()
    .replace(/^(rua|r\.|av\.|av |avenida|alameda|al\.|travessa|tv\.|pra[cç]a|p[cç]a\.)\s+/i, '')
    .trim();
}

// Monta chave única pelo nome normalizado + numero
function chaveEndereco(rua, numero){
  return normalizarRua(rua).toLowerCase() + '|' + (numero||'').trim();
}

// Carrega histórico de todos os dias do Firebase pra montar autocomplete
function carregarHistoricoEnderecos(){
  enderecoHistorico = {};

  // Busca todas as entregas de todos os usuários pra ter histórico completo de endereços
  db.ref('entregas').once('value', snap=>{
    const allUsers = snap.val()||{};
    Object.values(allUsers).forEach(userDias=>{
      if(!userDias || typeof userDias !== 'object') return;
      Object.values(userDias).forEach(dia=>{
        if(!dia || typeof dia !== 'object') return;
        Object.values(dia).forEach(e=>{
          if(!e || !e.rua) return;
          const chave = chaveEndereco(e.rua, e.numero);
          // Guarda sempre o nome mais completo (com "Rua" na frente)
          const ruaFull = temPrefixoLog(e.rua)
            ? e.rua.trim()
            : 'Rua ' + normalizarRua(e.rua);
          if(!enderecoHistorico[chave]){
            enderecoHistorico[chave] = {
              rua: ruaFull,
              numero: (e.numero||'S/N').trim(),
              taxa: e.taxa||0,
              count: 1
            };
          } else {
            enderecoHistorico[chave].count++;
            enderecoHistorico[chave].taxa = e.taxa||enderecoHistorico[chave].taxa;
            // Prefere o nome mais longo (mais completo)
            if(ruaFull.length > enderecoHistorico[chave].rua.length){
              enderecoHistorico[chave].rua = ruaFull;
            }
          }
        });
      });
    });
    console.log('Histórico carregado:', Object.keys(enderecoHistorico).length, 'endereços');
  }, err=>{
    console.error('Firebase (histórico):', err);
    toast('⚠️ Não consegui carregar as sugestões de endereço');
  });
}

// Expande abreviações comuns para busca
function expandirParaBusca(texto){
  return texto.trim().toLowerCase()
    // prefixos de logradouro
    .replace(/^av\.\s*/i,  'avenida ')
    .replace(/^av\s+/i,    'avenida ')
    .replace(/^r\.\s*/i,   'rua ')
    .replace(/^al\.\s*/i,  'alameda ')
    .replace(/^tv\.\s*/i,  'travessa ')
    .replace(/^pça\.\s*/i, 'praça ')
    // remove acentos pra comparação
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

// Remove acentos de string
function semAcento(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

let _sugestoesAtuais = [];
function selecionarSugestao(idx){
  const e = _sugestoesAtuais[idx];
  if(e) selecionarEndereco(e.rua, e.numero, e.taxa);
}

function mostrarSugestoes(texto){
  const el = document.getElementById('autocompleteList');
  if(!texto || texto.length < 2){ el.style.display='none'; return; }

  const q        = expandirParaBusca(texto);
  const qOrig    = texto.trim().toLowerCase();

  const resultados = Object.values(enderecoHistorico)
    .filter(e => {
      if(!e.rua) return false;
      const ruaSemAcento = semAcento(e.rua);
      // busca pelo texto expandido OU pelo texto original
      return ruaSemAcento.includes(q) || ruaSemAcento.includes(qOrig);
    })
    .sort((a,b)=>{
      const ra=a.rua.toLowerCase(), rb=b.rua.toLowerCase();
      if(ra!==rb) return ra.localeCompare(rb);
      return (parseInt(a.numero)||0)-(parseInt(b.numero)||0);
    })
    .slice(0,10);

  if(resultados.length===0){ el.style.display='none'; return; }

  // Posiciona logo abaixo do campo de rua
  const input = document.getElementById('inputRua');
  const rect  = input.getBoundingClientRect();
  el.style.top = (rect.bottom + 6) + 'px';

  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  _sugestoesAtuais = resultados;
  const reHl = new RegExp(`(${esc(texto)})`, 'gi');
  el.innerHTML = resultados.map((e,idx)=>{
    // destaca o trecho digitado (escapando o resto)
    const hl = e.rua.split(reHl).map((p,k)=> k%2 ? `<span class="ac-hl">${escHtml(p)}</span>` : escHtml(p)).join('');
    return `<div class="autocomplete-item" onclick="selecionarSugestao(${idx})">
      <div class="ac-rua">${hl}, nº ${escHtml(e.numero)}</div>
      <div class="ac-info">Taxa: <span class="ac-taxa">${fmt(e.taxa)}</span> · ${e.count}x entregue</div>
    </div>`;
  }).join('');

  el.style.display = 'block';

  // Detecta rolagem — se rolou, não seleciona ao levantar o dedo
  let touchStartY = 0;
  let scrollou    = false;
  el.ontouchstart = ev => { touchStartY = ev.touches[0].clientY; scrollou = false; };
  el.ontouchmove  = ev => { if(Math.abs(ev.touches[0].clientY - touchStartY) > 8) scrollou = true; };
  el.ontouchend   = ev => {
    if(scrollou) { ev.preventDefault(); return; }
    // Se não rolou, deixa o onclick disparar normalmente
  };
}

function selecionarEndereco(rua, numero, taxa){
  document.getElementById('inputRua').value    = rua;
  document.getElementById('inputNumero').value = numero;
  document.getElementById('inputTaxa').value   = taxa;
  document.getElementById('taxaPreview').textContent = '→ ' + fmt(taxa);
  document.getElementById('autocompleteList').style.display = 'none';

}

function fecharSugestoes(){

document.getElementById('inputTaxa').addEventListener('input', function(){

});

// Listeners do inputRua — remove acentos em tempo real
document.getElementById('inputRua').addEventListener('input', function(){
  const semAc = this.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(semAc !== this.value){
    const pos = this.selectionStart - (this.value.length - semAc.length);
    this.value = semAc;
    this.setSelectionRange(pos, pos);
  }
  mostrarSugestoes(this.value.trim());
});
document.getElementById('inputRua').addEventListener('blur', fecharSugestoes);
document.getElementById('inputRua').addEventListener('focus', function(){
  if(this.value.trim().length >= 2) mostrarSugestoes(this.value.trim());
});

function adicionarEntrega(){
  verificarVirouDia();   // garante que está no dia certo antes de salvar
  const rua    = document.getElementById('inputRua').value.trim();
  const numero = document.getElementById('inputNumero').value.trim();
  const taxaRaw= document.getElementById('inputTaxa').value.trim();
  if(!rua){ toast('⚠️ Digite a rua!'); document.getElementById('inputRua').focus(); return; }
  const taxa = parseFloat(taxaRaw);
  if(!taxaRaw||isNaN(taxa)||taxa<0){ toast('⚠️ Taxa inválida!'); document.getElementById('inputTaxa').focus(); return; }

  // Remove acentos e normaliza a rua antes de salvar
  const ruaSemAc = removerAcentos(rua.trim());
  const ruaNorm = temPrefixoLog(ruaSemAc)
    ? ruaSemAc
    : 'Rua ' + normalizarRua(ruaSemAc);

  const id  = Date.now();
  const ent = { id, rua: ruaNorm, numero: numero||'S/N', taxa, ts: id, user: usuarioAtual };

  // Salva no Firebase (com fila offline)
  salvarComFila(`${pathUser(usuarioAtual)}/${id}`, ent).catch(err=>{
    console.error('Firebase (salvar entrega):', err);
    toast('❌ ERRO ao salvar a entrega! Confira a conexão e anote essa entrega.');
  });

  // Atualiza cache local
  const chave = chaveEndereco(ruaNorm, numero||'S/N');
  if(!enderecoHistorico[chave]){
    enderecoHistorico[chave] = { rua: ruaNorm, numero: numero||'S/N', taxa, count: 1 };
  } else {
    enderecoHistorico[chave].count++;
    enderecoHistorico[chave].taxa = taxa;
  }

  document.getElementById('inputRua').value    = '';
  document.getElementById('inputNumero').value = '';
  document.getElementById('inputTaxa').value   = '';
  document.getElementById('taxaPreview').textContent = '';
  document.getElementById('autocompleteList').style.display = 'none';
  document.getElementById('inputRua').focus();
  toast('✓ Entrega registrada!');
}

// ── Rota com várias entregas (Google Maps) ──
// Marca as entregas na ordem que quer passar; a última marcada vira o destino final.
// Limite do Maps no celular: 3 paradas no meio + destino = 4 entregas.
const MAX_PARADAS_ROTA = 4;
let _modoRota = false;
let _rotaSel  = [];   // ids na ordem marcada

function sairModoRota(){ _modoRota = false; _rotaSel = []; }

function toggleModoRota(){
  _modoRota = !_modoRota;
  _rotaSel = [];
  if(_modoRota) prepararLocalizacao();   // já pega o GPS enquanto você escolhe as entregas
  renderHistorico();
}

// Ordem automática: do ponto mais perto de você até o mais longe (o mais longe vira o destino final)
let _rotaAuto = (()=>{ try{ return localStorage.getItem('routex_rota_auto')!=='0'; }catch(e){ return true; } })();
function toggleRotaAuto(){
  _rotaAuto = !_rotaAuto;
  try{ localStorage.setItem('routex_rota_auto', _rotaAuto?'1':'0'); }catch(e){}
  renderHistorico();
}
const _geoCache = {};          // rua|numero → {lat,lng} (ou null se não achou)
let _geoFila = Promise.resolve();
let _locRota = null;           // última localização do GPS: {lat,lng,ts}
const _pausa = ms => new Promise(r=>setTimeout(r,ms));
// GPS ligado enquanto o entregador está com uma entrega aberta / escolhendo rota (desliga sozinho em 10 min).
// Assim o app sabe a posição EXATA na hora de abrir o Maps e manda ela como ponto de partida
// (sem isso o Maps às vezes parte de uma posição antiga).
let _gpsWatch = null, _gpsTimer = null;
function prepararLocalizacao(){
  if(!navigator.geolocation) return;
  if(_gpsWatch!==null){ try{ navigator.geolocation.clearWatch(_gpsWatch); }catch(_){} _gpsWatch = null; }
  clearTimeout(_gpsTimer);
  try{
    _gpsWatch = navigator.geolocation.watchPosition(
      p=>{ _locRota = { lat:p.coords.latitude, lng:p.coords.longitude, ts:Date.now() }; },
      ()=>{},
      { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
    );
  }catch(_){}
  _gpsTimer = setTimeout(()=>{ if(_gpsWatch!==null){ try{ navigator.geolocation.clearWatch(_gpsWatch); }catch(_){} _gpsWatch = null; } }, 600000);
}
// ponto de partida pro Maps: só se a posição for recente (senão deixa o Maps usar a dele)
function origemRota(){
  if(USUARIOS[usuarioAtual] && USUARIOS[usuarioAtual].tipo!=='entregador') return '';
  if(_locRota && Date.now()-_locRota.ts < 120000) return `&origin=${encodeURIComponent(_locRota.lat.toFixed(6)+','+_locRota.lng.toFixed(6))}`;
  return '';
}
function geoDaEntrega(e){
  const k = e.rua+'|'+e.numero;
  if(k in _geoCache) return Promise.resolve(_geoCache[k]);
  // uma busca por vez, com 1s de intervalo (regra do serviço gratuito de endereços)
  _geoFila = _geoFila.then(async()=>{
    if(k in _geoCache) return;
    try{ _geoCache[k] = await geocodificar(e.rua, e.numero); }catch(_){ _geoCache[k] = null; }
    await _pausa(1100);
  });
  return _geoFila.then(()=>_geoCache[k]);
}
async function ordenarParadas(sel){
  const geos = await Promise.race([ Promise.all(sel.map(geoDaEntrega)), _pausa(5000).then(()=>null) ]);
  if(!geos || geos.some(g=>!g)) return null;                       // não achou algum endereço: mantém a sua ordem
  let atual = _locRota || LANCHONETE;
  let resto = sel.map((e,i)=>({ e, g:geos[i] })), ord = [];
  while(resto.length){
    let bi = 0, bd = Infinity;
    resto.forEach((r,i)=>{ const d = kmLinhaReta(atual, r.g); if(d<bd){ bd=d; bi=i; } });
    const [r] = resto.splice(bi,1); ord.push(r.e); atual = r.g;
  }
  return ord;
}

function selecionarParaRota(id){
  id = String(id);
  const k = _rotaSel.indexOf(id);
  if(k>=0) _rotaSel.splice(k,1);
  else {
    if(_rotaSel.length >= MAX_PARADAS_ROTA){ toast(`⚠️ O Google Maps no celular aceita até ${MAX_PARADAS_ROTA} paradas por rota`); return; }
    _rotaSel.push(id);
    const ent = entregasLocal.find(x=>String(x.id)===id); if(ent && _rotaAuto) geoDaEntrega(ent);   // já busca o endereço em segundo plano
  }
  const sc = document.getElementById('histScroll'); const top = sc.scrollTop;
  renderHistorico();
  sc.scrollTop = top;
}

// Abre o link do Maps DIRETO NO APP (Android). Se o app não existir, cai pro site.
// iPhone/PC: abre o link normal.
function navegarPara(url){ location.href = url; }
function abrirNoMaps(url){
  if(/Android/i.test(navigator.userAgent||'')){
    const semProtocolo = url.replace(/^https:\/\//,'');
    navegarPara(`intent://${semProtocolo}#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=${encodeURIComponent(url)};end`);
  } else {
    window.open(url,'_blank');
  }
}

let _abrindoRota = false;
async function abrirRotaMultipla(){
  if(_abrindoRota) return;
  let sel = _rotaSel.map(id=>entregasLocal.find(e=>String(e.id)===id)).filter(Boolean);
  if(!sel.length) return;
  if(_rotaAuto && sel.length>=2){
    _abrindoRota = true;
    try{
      const ord = await ordenarParadas(sel);
      if(ord) sel = ord; else toast('⚠️ Não consegui ordenar, usei a sua ordem');
    }catch(_){} finally { _abrindoRota = false; }
  }
  const addr = e => `${e.rua}, ${(e.numero && e.numero!=='S/N') ? e.numero+', ' : ''}Londrina, PR, Brasil`;
  const destino = addr(sel[sel.length-1]);
  const paradas = sel.slice(0,-1).map(addr);
  // parte da posição EXATA do GPS (se recente); senão o Maps usa a localização dele
  let url = `https://www.google.com/maps/dir/?api=1${origemRota()}&destination=${encodeURIComponent(destino)}&travelmode=driving`;
  if(paradas.length) url += `&waypoints=${paradas.map(encodeURIComponent).join('%7C')}`;
  abrirNoMaps(url);
}

function renderDiasAnteriores(){

  Promise.all(meusAliases.map(a=>db.ref(`entregas/${a}`).once('value'))).then(snaps=>{

function abrirDetalhe(id, user, data){
  const _caminho = `entregas/${user}/${data}/${id}`;
  const _pend = filaBuscar(_caminho);
  const _cb = (e)=>{
    if(!e) return;
    idAtual  = id;
    entAtual = { ...e, _user: user, _data: data };

    const lista = user===usuarioAtual ? entregasLocal : [];
    const num   = lista.findIndex(x=>String(x.id)===String(id))+1 || '?';

    document.getElementById('detBadge').textContent = '🚀 Entrega #'+num;

    // Controla edição de endereço

    const podeExcluir = tipo==='adm' || (USUARIOS[usuarioAtual].alias||[usuarioAtual]).includes(user);

    calcularDistancia(e);
  };

// ── Distância ──
// Entregador: distância REAL pelas ruas (rota de carro/moto) da localização atual dele até o endereço.
// ADM/Supervisor, ou sem permissão de GPS: da lanchonete até o endereço.
const LANCHONETE = { lat:-23.3425, lng:-51.2053 };
let _distToken = 0;

function pegarLocalizacao(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({ lat:p.coords.latitude, lng:p.coords.longitude }),
      ()=>res(null),
      { timeout:7000, enableHighAccuracy:true, maximumAge:30000 }
    );
  });
}

function kmLinhaReta(a,b){
  const R=6371, dL=(b.lat-a.lat)*Math.PI/180, dl=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

async function geocodificar(rua, numero){
  const tentativas = [];
  if(numero && numero!=='S/N') tentativas.push(`${rua}, ${numero}, Londrina, PR, Brasil`);
  tentativas.push(`${rua}, Londrina, PR, Brasil`);            // se não achar o número, usa a rua
  for(const q of tentativas){
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=br`,{headers:{'Accept-Language':'pt-BR'}});
    const data = await r.json();
    if(data && data.length) return { lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon), exato: q===tentativas[0] && tentativas.length>1 };
  }
  return null;
}

async function calcularDistancia(e){
  const meuToken = ++_distToken;
  const box=document.getElementById('detDistBox');
  const val=document.getElementById('detDistVal');
  const lbl=document.getElementById('detDistLabel');
  box.style.display='flex'; val.innerHTML='Calculando...';
  lbl.textContent='Distância da lanchonete';
  const msg = t => `<span style="font-size:13px;color:var(--text2)">${t}</span>`;
  try{
    const destino = await geocodificar(e.rua, e.numero);
    if(meuToken!==_distToken) return;              // abriu outra entrega no meio do caminho
    if(!destino){ val.innerHTML=msg('Endereço não encontrado'); return; }

    // origem: GPS do entregador (se permitir); senão a lanchonete
    let origem = LANCHONETE, doGps = false;
    if(USUARIOS[usuarioAtual] && USUARIOS[usuarioAtual].tipo==='entregador'){
      const loc = await pegarLocalizacao();
      if(meuToken!==_distToken) return;
      if(loc){ origem = loc; doGps = true; }
    }
    lbl.textContent = doGps ? 'Distância de você até o endereço' : 'Distância da lanchonete';

    // distância pelas ruas (OSRM); se falhar, estima em linha reta x 1,3
    const rt = await rotaKm(origem, destino);
    let { km, min, aprox } = rt;
    if(meuToken!==_distToken) return;

    const dist = km<1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1).replace('.',',')} km`;
    const nota = aprox ? ' · estimado' : (destino.exato===false ? ' · só a rua (nº não achado)' : '');
    val.innerHTML = `${dist} <span class="det-dist-sub">~${min} min de moto${nota}</span>`;

    // taxa sugerida: sempre pela distância da LANCHONETE até o endereço
    if(_podeEditarDet && FAIXAS){
      const kmLanch = doGps ? (await rotaKm(LANCHONETE, destino)).km : km;
      if(meuToken!==_distToken) return;
      mostrarSugestaoTaxa(kmLanch);
    }
  } catch { if(meuToken===_distToken) val.innerHTML=msg('Sem conexão'); }
}

async function rotaKm(origem, destino){
  let km, min, aprox = false;
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${origem.lng},${origem.lat};${destino.lng},${destino.lat}?overview=false`;
    const r = await fetch(url);
    const j = await r.json();
    if(j.code==='Ok' && j.routes && j.routes[0]){ km = j.routes[0].distance/1000; min = Math.max(1, Math.round(j.routes[0].duration/60)); }
  }catch(_){}
  if(km==null){ km = kmLinhaReta(origem,destino)*1.3; min = Math.max(1, Math.ceil(km/0.3)); aprox = true; }
  return { km, min, aprox };
}

// ── Taxa sugerida pela distância (faixas definidas pelo ADM na aba Perfis) ──
let FAIXAS = null;            // { faixas:[{ate,taxa}], acima:number|null }  — null = recurso desligado
let _taxaSug = null, _podeEditarDet = false;
function normalizarFaixas(v){
  if(!v) return null;
  const arr = (Array.isArray(v.faixas) ? v.faixas : Object.values(v.faixas||{}))
    .map(f=>({ ate:Number(f&&f.ate), taxa:Number(f&&f.taxa) })).filter(f=>isFinite(f.ate)&&isFinite(f.taxa)&&f.ate>0&&f.taxa>=0)
    .sort((a,b)=>a.ate-b.ate);
  const acima = (v.acima==null || v.acima==='' || !isFinite(Number(v.acima))) ? null : Number(v.acima);
  return arr.length ? { faixas:arr, acima } : null;
}
function taxaPorKm(km){
  if(!FAIXAS) return null;
  for(const f of FAIXAS.faixas) if(km <= f.ate) return f.taxa;
  return FAIXAS.acima;
}
_authPronta.then(()=>{
  db.ref('config/faixasTaxa').on('value', snap=>{ FAIXAS = normalizarFaixas(snap.val()); },
    err=>console.error('Firebase (faixas):', err));
});
function mostrarSugestaoTaxa(km){
  const sug = taxaPorKm(km);
  const b = document.getElementById('detSugTaxa');
  if(sug==null || !entAtual || Math.abs(sug - Number(entAtual.taxa)) < 0.005){ b.style.display='none'; _taxaSug=null; return; }
  _taxaSug = sug;
  b.innerHTML = `💡 Taxa sugerida pela distância:<br><b style="font-size:17px;white-space:nowrap;">${fmt(sug)}</b><br><span style="font-size:11px;font-weight:600;opacity:.8;">Toque para aplicar</span>`;
  b.style.display = 'block';
}
function aplicarTaxaSugerida(){
  if(!entAtual || _taxaSug==null) return;
  const nova = _taxaSug;
  db.ref(`entregas/${entAtual._user}/${entAtual._data}/${idAtual}/taxa`).set(nova).catch(err=>{ console.error(err); toast('❌ Erro ao salvar a taxa'); });
  entAtual.taxa = nova;
  document.getElementById('detTaxa').textContent = fmt(nova);
  document.getElementById('detSugTaxa').style.display = 'none'; _taxaSug = null;
  toast('✓ Taxa ajustada para '+fmt(nova));
}

function linhaFaixa(ate,taxa,inp){
  inp = inp || "background:rgba(0,0,0,0.3);border:1.5px solid rgba(96,165,250,0.4);border-radius:8px;padding:7px 8px;color:#f0f4ff;font-size:13px;font-weight:700;font-family:'Inter',sans-serif;outline:none;width:68px;-webkit-appearance:none;";

function addFaixa(){
  const box=document.getElementById('faixasLinhas'); if(!box) return;
  const ult = box.querySelectorAll('.faixa-linha'); const ref = ult.length ? ult[ult.length-1] : null;

function salvarFaixas(){
  const linhas = [...document.querySelectorAll('#faixasLinhas .faixa-linha')].map(l=>({
    ate: parseFloat(l.querySelector('.faixa-ate').value), taxa: parseFloat(l.querySelector('.faixa-taxa').value) }));
  if(linhas.some(l=>!isFinite(l.ate)||l.ate<=0||!isFinite(l.taxa)||l.taxa<0)){ toast('⚠️ Preencha todos os km e valores'); return; }
  const ates = linhas.map(l=>l.ate); if(new Set(ates).size!==ates.length){ toast('⚠️ Tem duas faixas com o mesmo km'); return; }
  linhas.sort((a,b)=>a.ate-b.ate);
  const av = parseFloat((document.getElementById('faixaAcima')||{}).value);
  const cfg = { faixas: linhas, acima: isFinite(av) ? av : null };

    .then(()=>{ FAIXAS = normalizarFaixas(cfg); renderFaixasEditor(); toast(linhas.length?'✓ Faixas salvas!':'Taxa sugerida desligada'); })
    .catch(e=>{ console.error(e); toast('❌ Não consegui salvar as faixas'); });
}

// ── Backup ──
const NOMES_MES_G = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function perfisSemSenha(v){
  const o = {}; Object.entries(v||{}).forEach(([k,p])=>{ if(!p) return; const c={...p}; delete c.senha; o[k]=c; }); return o;
}
async function fazerBackup(){
  const [e,p] = await Promise.all([ db.ref('entregas').once('value'), db.ref('perfis').once('value') ]);
  const chave = hoje();
  await db.ref('backups/'+chave).set({ criadoEm:Date.now(), entregas:e.val()||{}, perfis:perfisSemSenha(p.val()) });
  await db.ref('backups/_meta').update({ ultimo:Date.now(), ['lista/'+chave]:true });
  // mantém só os 4 mais recentes
  const lista = Object.keys((await db.ref('backups/_meta/lista').once('value')).val()||{}).sort();
  const velhos = lista.slice(0, Math.max(0, lista.length-4));
  if(velhos.length){
    const upd = {}; velhos.forEach(k=>{ upd[k]=null; upd['_meta/lista/'+k]=null; });
    await db.ref('backups').update(upd);
  }
}
async function backupSeNecessario(){
  try{
    await _authPronta;
    const ult = (await db.ref('backups/_meta/ultimo').once('value')).val();
    if(ult && Date.now()-ult < 7*86400000) return;
    await fazerBackup();
  }catch(e){ console.warn('Backup automático:', e); }
}
async function backupAgora(){
  toast('💾 Fazendo backup...');
  try{ await fazerBackup(); toast('✓ Backup salvo no banco!'); carregarInfoBackup(); }
  catch(e){ console.error(e); toast('❌ Não consegui fazer o backup'); }
}
async function baixarBackup(){
  try{
    const [e,p] = await Promise.all([ db.ref('entregas').once('value'), db.ref('perfis').once('value') ]);
    const dados = { app:'RouteX', geradoEm:new Date().toISOString(), entregas:e.val()||{}, perfis:perfisSemSenha(p.val()) };
    const blob = new Blob([JSON.stringify(dados,null,1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `routex-backup-${hoje()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('✓ Backup baixado!');
  }catch(err){ console.error(err); toast('❌ Não consegui baixar o backup'); }
}
async function carregarInfoBackup(){
  const el = document.getElementById('backupInfo'); if(!el) return;
  try{
    const ult = (await db.ref('backups/_meta/ultimo').once('value')).val();
    el.textContent = ult ? 'Último backup no banco: '+new Date(ult).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' (automático toda semana, guarda os 4 últimos)' : 'Ainda não há backup no banco. O primeiro é feito sozinho quando o ADM entra.';
  }catch(e){ el.textContent=''; }
}
function htmlConfigExtras(){
  const btn = "border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;";
  return `

function renderAdm(){
  const tipo = USUARIOS[usuarioAtual].tipo;
  document.getElementById('admNomeHeader').textContent = tipo === 'supervisor' ? `👀 ${usuarioAtual}` : 'Painel ADM';
  document.getElementById('admDataHeader').textContent = fmtData(hoje());

  // Esconde aba de perfis pro supervisor
  const tabPerfis = document.getElementById('tab_perfis');
  if(tabPerfis) tabPerfis.style.display = tipo === 'adm' ? '' : 'none';

  // Reseta endereços pra recarregar
  _enderecoCardCarregado = false;

  // Inicia na aba "Hoje"
  trocarAbaAdm('dia');
}

// ── Navegação por abas no ADM ──
let abaAdmAtiva = 'dia';

function trocarAbaAdm(aba){
  // Esconde todas as abas
  ['dia','historico','enderecos','perfis'].forEach(a=>{
    const el = document.getElementById(`aba_${a}`);
    const btn = document.getElementById(`tab_${a}`);
    if(el) el.style.display = 'none';
    if(btn) btn.classList.remove('active');
  });

  // Mostra a aba selecionada
  const abaEl = document.getElementById(`aba_${aba}`);
  const tabEl = document.getElementById(`tab_${aba}`);
  if(abaEl) abaEl.style.display = 'block';
  if(tabEl) tabEl.classList.add('active');
  abaAdmAtiva = aba;

  // Carrega dados da aba se necessário
  if(aba === 'enderecos' && !_enderecoCardCarregado) carregarEnderecosCard();
  if(aba === 'historico') renderHistoricoCard();
  if(aba === 'dia') renderDiaCard();
  if(aba === 'perfis') renderPerfiis();
}

function editarPerfil(user){ document.getElementById(`form_${user}`).style.display='block'; }
function cancelarEditPerfil(user){ document.getElementById(`form_${user}`).style.display='none'; }
function salvarPerfil(user){
  const novaSenha=document.getElementById(`input_senha_${user}`).value.trim();
  if(!novaSenha){ toast('⚠️ Digite uma senha!'); return; }
  const c = novaCredencial(novaSenha);
  Object.assign(USUARIOS[user], { hash:c.hash, salt:c.salt });
  delete USUARIOS[user].senhaLegada; delete USUARIOS[user].senhaVisivel;
  db.ref(`perfis/${user}`).update({ hash:c.hash, salt:c.salt, senha:null }).catch(err=>{ console.error(err); toast('❌ Não consegui salvar a senha no banco'); });
  cancelarEditPerfil(user);
  toast(`✓ Senha de ${user} atualizada!`);
}

function renderDiaCard(){
  const entregadores=Object.keys(USUARIOS).filter(u=>USUARIOS[u].tipo==='entregador');
  let pendentes=entregadores.length; let dadosEnt={};
  entregadores.forEach(user=>{
    const primary=(USUARIOS[user].alias||[user])[0];
    db.ref(`entregas/${primary}/${hoje()}`).once('value', snap=>{
      dadosEnt[user]=Object.values(snap.val()||{}).sort((a,b)=>a.ts-b.ts);
      pendentes--;
      if(pendentes===0) renderDiaBody(dadosEnt,entregadores);
    });
  });
}

function renderDiaBody(dadosEnt,entregadores){
  let totalGeral=0, html='';
  entregadores.forEach(user=>{
    const lista=dadosEnt[user]||[]; const soma=lista.reduce((s,e)=>s+(Number(e.taxa)||0),0); totalGeral+=soma;
    html+=`<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;"
      onclick="verEntregadorHoje('${user}')">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="font-size:14px;font-weight:800;color:var(--text);">${USUARIOS[user].emoji} ${user}</div>
        <div style="font-size:15px;font-weight:900;color:var(--green);">${fmt(soma)}</div>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--text2);">${lista.length} entrega${lista.length!==1?'s':''} · Ver detalhes ›</div>

    border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:4px;">

  document.getElementById('admDiaSub').textContent=`${fmtData(hoje())} · ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

function barraFechamento(){
  const ym = hoje().slice(0,7), [yy,mm] = ym.split('-');
  return `<button onclick="abrirFechamento('${ym}')" style="width:100%;margin-bottom:14px;background:linear-gradient(135deg,rgba(52,211,153,0.14),rgba(96,165,250,0.1));
    color:var(--green);border:1px solid rgba(52,211,153,0.3);border-radius:12px;padding:12px;font-size:13px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;">
    📤 Fechamento de ${NOMES_MES_G[parseInt(mm)-1]} (mês atual)</button>`;
}
function abrirFechamento(ym){
  db.ref('entregas').once('value', snap=>{
    const all = snap.val()||{};
    const entregadores = Object.keys(USUARIOS).filter(u=>USUARIOS[u].tipo==='entregador');
    const linhas = []; let totEnt = 0, totVal = 0;
    entregadores.forEach(user=>{
      let n = 0, soma = 0; const dias = new Set();
      (USUARIOS[user].alias||[user]).forEach(a=>{
        const d = all[a]||{};
        Object.keys(d).forEach(dia=>{
          if(dia.slice(0,7)!==ym) return;
          Object.values(d[dia]||{}).forEach(e=>{ if(!e) return; n++; soma += Number(e.taxa)||0; dias.add(dia); });
        });
      });
      if(n){ linhas.push({ user, n, soma, dias:dias.size }); totEnt += n; totVal += soma; }
    });
    const [yy,mm] = ym.split('-'); const nomeMes = `${NOMES_MES_G[parseInt(mm)-1]} ${yy}`;
    document.getElementById('relDiaTitulo').textContent = `📤 Fechamento — ${nomeMes}`;
    let html = '';
    if(!linhas.length){
      html = `<div class="hist-empty"><div class="ei">📅</div><p>Nenhuma entrega em ${nomeMes}.</p></div>`;
    } else {
      linhas.forEach(l=>{
        html += `<div class="rel-ent-block"><div class="rel-ent-header">
          <span class="rel-ent-name">🛵 ${escHtml(l.user)}</span>
          <span class="rel-ent-badge">${l.n} entregas · ${l.dias} ${l.dias===1?'dia':'dias'}</span></div>
          <div class="rel-total-row"><span class="rel-total-label">Total em taxas</span><span class="rel-total-val">${fmt(l.soma)}</span></div></div>`;
      });
      html += `<div style="background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.18);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;">
        <span style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;">Total geral · ${totEnt} entregas</span>
        <span style="font-size:22px;font-weight:900;color:var(--green);letter-spacing:-0.6px;">${fmt(totVal)}</span></div>
        <div class="no-print" style="display:flex;gap:8px;">
          <button onclick="enviarFechamentoZap()" style="flex:1;background:linear-gradient(135deg,#059669,#34d399);color:#04130d;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;">💬 WhatsApp</button>
          <button onclick="window.print()" style="flex:1;background:rgba(96,165,250,0.12);color:var(--accent);border:1px solid rgba(96,165,250,0.3);border-radius:12px;padding:12px;font-size:13px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;">📄 Salvar PDF</button>
        </div>`;
      window._fechTexto = `*RouteX — Fechamento de ${nomeMes}*\n\n` +
        linhas.map(l=>`🛵 ${l.user}: ${l.n} entregas · ${fmt(l.soma)}`).join('\n') +
        `\n\n*Total: ${totEnt} entregas · ${fmt(totVal)}*`;
    }
    document.getElementById('relDiaConteudo').innerHTML = html;
    document.getElementById('modalRelDia').classList.add('show');
  });
}
function enviarFechamentoZap(){
  if(!window._fechTexto) return;
  window.open('https://wa.me/?text='+encodeURIComponent(window._fechTexto), '_blank');
}

function renderHistoricoCard(){
  db.ref('entregas').once('value', snap=>{
    const allData=snap.val()||{};
    const entregadores=Object.keys(USUARIOS).filter(u=>USUARIOS[u].tipo==='entregador');
    const dias=new Set();
    entregadores.forEach(user=>{ (USUARIOS[user].alias||[user]).forEach(alias=>{ if(allData[alias]) Object.keys(allData[alias]).forEach(d=>dias.add(d)); }); });
    // ADM vê o histórico de todos os meses; supervisor continua vendo só o mês atual
    const ehAdm = USUARIOS[usuarioAtual].tipo==='adm';
    const diasAnt=[...dias].sort().reverse().filter(d=>d!==hoje()&&(ehAdm||dentrodoMes(d)));
    if(!diasAnt.length){
      document.getElementById('historicoAdmList').innerHTML=barraFechamento()+`<div class="hist-empty"><div class="ei">📅</div><p>${ehAdm?'Nenhum dia anterior ainda.':'Nenhum dia anterior neste mês.'}</p></div>`;
      return;
    }
    const NOMES_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    let html='', mesAnterior='';
    diasAnt.forEach(dia=>{
      let totalDia=0,totalEnt=0,resumo='';
      entregadores.forEach(user=>{
        const aliases=USUARIOS[user].alias||[user]; let lista=[];
        aliases.forEach(alias=>{ if(allData[alias]&&allData[alias][dia]) lista=lista.concat(Object.values(allData[alias][dia])); });
        const soma=lista.reduce((s,e)=>s+(Number(e.taxa)||0),0);
        if(lista.length>0){ totalDia+=soma; totalEnt+=lista.length;
          resumo+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid rgba(255,255,255,0.05);">
            <span style="font-size:12px;font-weight:600;color:var(--text2);">${user} · ${lista.length} entregas</span>
            <span style="font-size:12px;font-weight:700;color:var(--accent);">${fmt(soma)}</span></div>`;
        }
      });
      if(totalEnt>0 && ehAdm && dia.slice(0,7)!==mesAnterior){
        mesAnterior = dia.slice(0,7);
        const [yy,mm] = mesAnterior.split('-');
        html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin:${html?'14px':'2px'} 2px 8px;"><span style="font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:0.8px;">${NOMES_MES[parseInt(mm)-1]} ${yy}</span>
          <button onclick="abrirFechamento('${mesAnterior}')" style="background:rgba(52,211,153,0.1);color:var(--green);border:1px solid rgba(52,211,153,0.3);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;">📤 Fechar mês</button></div>`;
      }
      if(totalEnt>0) html+=`<div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;"
          onclick="verRelDia('${jsStr(dia)}')">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:13px;font-weight:800;color:var(--text);">${fmtData(dia)}</span>
            <span style="font-size:14px;font-weight:900;color:var(--green);">${fmt(totalDia)}</span>
          </div>${resumo}
          <div style="font-size:11px;font-weight:600;color:var(--text2);margin-top:6px;">Ver detalhes ›</div>
        </div>`;
    });
    document.getElementById('historicoAdmList').innerHTML=barraFechamento()+(html||`<div class="hist-empty"><div class="ei">📅</div><p>Sem entregas anteriores.</p></div>`);
  });
}

let _enderecoCardCarregado=false;
function carregarEnderecosCard(){
  if(_enderecoCardCarregado) return;
  const el=document.getElementById('endListCard');
  el.innerHTML=`<div class="hist-empty"><div class="ei">🔄</div><p>Carregando...</p></div>`;
  db.ref('entregas').once('value', snap=>{
    const allUsers=snap.val()||{}; const mapa={};
    Object.values(allUsers).forEach(userDias=>{
      if(!userDias||typeof userDias!=='object') return;
      Object.values(userDias).forEach(dia=>{
        if(!dia||typeof dia!=='object') return;
        Object.values(dia).forEach(e=>{
          if(!e||!e.rua) return;
          const ruaFull=temPrefixoLog(e.rua)?e.rua.trim():'Rua '+normalizarRua(e.rua);
          const chave=semAcento(ruaFull)+'|'+(e.numero||'').trim();
          if(!mapa[chave]){ mapa[chave]={rua:ruaFull,numero:(e.numero||'S/N').trim(),taxa:e.taxa||0,count:1}; }
          else{ mapa[chave].count++; if(e.taxa) mapa[chave].taxa=e.taxa; }
        });
      });
    });
    _todosEnderecos=Object.values(mapa).sort((a,b)=>a.rua.localeCompare(b.rua)||(parseInt(a.numero)||0)-(parseInt(b.numero)||0));
    _enderecoCardCarregado=true;
    renderEndListCard(_todosEnderecos,'');
  });
}

function filtrarEnderecosCard(texto){ renderEndListCard(_todosEnderecos,texto); }

    </div>`).join('');
}

function editarEnderecoCard(i){
  document.getElementById(`end_view_${i}`).style.display = 'none';
  document.getElementById(`end_edit_${i}`).style.display = 'block';
  document.getElementById(`end_rua_${i}`).focus();
}

function cancelarEditEnd(i){
  document.getElementById(`end_view_${i}`).style.display = 'flex';
  document.getElementById(`end_edit_${i}`).style.display = 'none';
}

async function salvarEnderecoCard(i){
  const orig = (window._endCardLista||[])[i];
  if(!orig){ toast('⚠️ Recarregue a lista e tente de novo'); return; }
  const ruaAntiga = orig.rua, numeroAntigo = orig.numero;

  const novaRua   = removerAcentos(document.getElementById(`end_rua_${i}`).value.trim());
  const novoNum   = document.getElementById(`end_num_${i}`).value.trim();
  const novaTaxa  = parseFloat(document.getElementById(`end_taxa_${i}`).value);

  if(!novaRua){ toast('⚠️ Digite o nome da rua!'); return; }
  if(isNaN(novaTaxa)||novaTaxa<0){ toast('⚠️ Taxa inválida!'); return; }

  toast('⏳ Atualizando...');

  try{
    // Busca todas as entregas com esse endereço e atualiza no Firebase
    const snap = await db.ref('entregas').once('value');
    const allData = snap.val()||{};
    const updates = {};
    let qtd = 0;

    const antigaSem = semAcento(ruaAntiga.trim());
    const numAnt    = (numeroAntigo||'').trim();
    // entregas antigas podem estar sem o "Rua " na frente
    const casaRua = r => { const x=semAcento((r||'').trim()); return x===antigaSem || (!temPrefixoLog(r) && ('rua '+x)===antigaSem); };
    const casaNum = n => { const x=(n||'').trim(); return x===numAnt || (numAnt==='S/N' && x===''); };

    Object.entries(allData).forEach(([user, dias])=>{
      if(!dias||typeof dias!=='object') return;
      Object.entries(dias).forEach(([dia, entregas])=>{
        if(!entregas||typeof entregas!=='object') return;
        Object.entries(entregas).forEach(([id, e])=>{
          if(!e||!e.rua) return;
          if(casaRua(e.rua) && casaNum(e.numero)){
            updates[`entregas/${user}/${dia}/${id}/rua`]    = novaRua;
            updates[`entregas/${user}/${dia}/${id}/numero`] = novoNum||e.numero||'S/N';
            updates[`entregas/${user}/${dia}/${id}/taxa`]   = novaTaxa;
            qtd++;
          }
        });
      });
    });

    if(qtd > 0){
      await db.ref().update(updates);
      toast(`✓ ${qtd} entrega${qtd!==1?'s':''} atualizada${qtd!==1?'s':''}!`);
    } else {
      toast('Nenhuma entrega encontrada com esse endereço');
    }
  }catch(err){
    console.error('Firebase (editar endereço):', err);
    toast('❌ Erro ao atualizar. Tente de novo.');
    return;
  }

  // Recarrega a lista e as sugestões do autocomplete
  _enderecoCardCarregado = false;
  carregarEnderecosCard();
  carregarHistoricoEnderecos();
}

// ── Ver entregador hoje ──
function verEntregadorHoje(user){
  db.ref(`entregas/${user}/${hoje()}`).once('value', snap=>{
    const data = snap.val()||{};
    const lista = Object.values(data).sort((a,b)=>a.ts-b.ts);
    const total = lista.length;
    document.getElementById('relDiaTitulo').textContent = `🛵 ${user} — Hoje`;
    let html='';
    if(total===0){
      html=`<div class="hist-empty"><div class="ei">📦</div><p>Nenhuma entrega hoje.</p></div>`;
    } else {
      html=`<div class="rel-ent-block"><div class="rel-ent-header">
        <span class="rel-ent-name">${user}</span>
        <span class="rel-ent-badge">${total} entregas</span></div>`;
      lista.forEach((e,i)=>{
        html+=`<div class="rel-item" onclick="abrirDetalhe('${jsStr(e.id)}','${user}','${hoje()}');fecharRelDia();" style="cursor:pointer;">
          <div><div style="font-size:12px;font-weight:600;color:var(--text);">${i+1}. ${escHtml(e.rua)}, nº ${escHtml(e.numero)}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">🕐 ${fmtHora(e.ts)}</div></div>
          <div class="rel-item-taxa">${fmt(e.taxa)}</div></div>`;
      });
      const soma=lista.reduce((s,e)=>s+(Number(e.taxa)||0),0);
      html+=`<div class="rel-total-row"><span class="rel-total-label">Total</span><span class="rel-total-val">${fmt(soma)}</span></div></div>`;
    }
    document.getElementById('relDiaConteudo').innerHTML=html;
    document.getElementById('modalRelDia').classList.add('show');
  });
}

// ── Ver rel dia anterior ──
function verRelDia(dia){
  document.getElementById('relDiaTitulo').textContent=`📊 ${fmtData(dia)}`;
  const entregadores=Object.keys(USUARIOS).filter(u=>USUARIOS[u].tipo==='entregador');
  db.ref('entregas').once('value', snap=>{
    const allData=snap.val()||{};
    let html='', totalGeral=0;

    entregadores.forEach(user=>{
      const aliases = USUARIOS[user].alias || [user];
      let lista = [];
      aliases.forEach(alias=>{
        if(allData[alias]&&allData[alias][dia]){
          lista = lista.concat(Object.values(allData[alias][dia]));
        }
      });
      lista.sort((a,b)=>a.ts-b.ts);
      if(lista.length===0) return;
      const soma=lista.reduce((s,e)=>s+(Number(e.taxa)||0),0);
      totalGeral+=soma;
      html+=`<div class="rel-ent-block"><div class="rel-ent-header">
        <span class="rel-ent-name">${user}</span>
        <span class="rel-ent-badge">${lista.length} entregas</span></div>`;
      lista.forEach((e,i)=>{
        // Descobre qual alias tem esse id
        let aliasCorreto = aliases[0];
        aliases.forEach(alias=>{
          if(allData[alias]&&allData[alias][dia]&&allData[alias][dia][e.id]) aliasCorreto = alias;
        });
        html+=`<div class="rel-item" onclick="abrirDetalhe('${jsStr(e.id)}','${aliasCorreto}','${jsStr(dia)}');fecharRelDia();" style="cursor:pointer;">
          <div><div style="font-size:12px;font-weight:600;color:var(--text);">${i+1}. ${escHtml(e.rua)}, nº ${escHtml(e.numero)}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">🕐 ${fmtHora(e.ts)}</div></div>
          <div class="rel-item-taxa">${fmt(e.taxa)}</div></div>`;
      });
      html+=`<div class="rel-total-row"><span class="rel-total-label">${user}</span><span class="rel-total-val">${fmt(soma)}</span></div></div>`;
    });

    html+=`<div style="background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.18);
      border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
      <span style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;">Total Geral</span>
      <span style="font-size:22px;font-weight:900;color:var(--green);letter-spacing:-0.6px;">${fmt(totalGeral)}</span></div>`;
    document.getElementById('relDiaConteudo').innerHTML=html;
    document.getElementById('modalRelDia').classList.add('show');
  });
}

function fecharRelDia(ev){
  if(!ev||ev.target===document.getElementById('modalRelDia'))
    document.getElementById('modalRelDia').classList.remove('show');
}

// ══════════════════════════════════════════
//  LISTA DE ENDEREÇOS (ADM)
// ══════════════════════════════════════════
function abrirEnderecos(){
  document.getElementById('inputBuscaEnd').value = '';
  document.getElementById('endCount').textContent = 'Carregando...';
  document.getElementById('endList').innerHTML = `<div class="hist-empty"><div class="ei">🔄</div><p>Buscando endereços...</p></div>`;
  document.getElementById('modalEnderecos').classList.add('show');

  // Busca direto do Firebase pra garantir que tem tudo
  db.ref('entregas').once('value', snap=>{
    const allUsers = snap.val()||{};
    const mapa = {};

    Object.values(allUsers).forEach(userDias=>{
      if(!userDias||typeof userDias!=='object') return;
      Object.values(userDias).forEach(dia=>{
        if(!dia||typeof dia!=='object') return;
        Object.values(dia).forEach(e=>{
          if(!e||!e.rua) return;
          const chave = semAcento(e.rua.trim()) + '|' + (e.numero||'').trim();
          const ruaFull = temPrefixoLog(e.rua)
            ? e.rua.trim()
            : 'Rua ' + normalizarRua(e.rua);
          if(!mapa[chave]){
            mapa[chave] = { rua: ruaFull, numero: (e.numero||'S/N').trim(), taxa: e.taxa||0, count: 1 };
          } else {
            mapa[chave].count++;
            if(e.taxa) mapa[chave].taxa = e.taxa;
            if(ruaFull.length > mapa[chave].rua.length) mapa[chave].rua = ruaFull;
          }
        });
      });
    });

    // Atualiza o histórico global também
    enderecoHistorico = { ...enderecoHistorico, ...mapa };

    renderEnderecosComDados(Object.values(mapa), '');
  });
}

function fecharEnderecos(ev){
  if(!ev||ev.target===document.getElementById('modalEnderecos'))
    document.getElementById('modalEnderecos').classList.remove('show');
}

let _todosEnderecos = [];

function filtrarEnderecos(texto){
  renderEnderecosComDados(_todosEnderecos, texto);
}

function renderEnderecosComDados(todos, filtro){
  _todosEnderecos = todos;

  const ordenados = [...todos].sort((a,b)=>
    a.rua.localeCompare(b.rua) || (parseInt(a.numero)||0)-(parseInt(b.numero)||0)
  );

  const q = semAcento((filtro||'').trim());
  const filtrados = q.length > 0
    ? ordenados.filter(e => semAcento(e.rua).includes(q) || (e.numero+'').toLowerCase().includes(q))
    : ordenados;

  document.getElementById('endCount').textContent = filtrados.length + (filtrados.length===1?' endereço':' endereços');

  const el = document.getElementById('endList');
  if(filtrados.length===0){
    el.innerHTML=`<div class="hist-empty"><div class="ei">📍</div><p>Nenhum endereço encontrado.</p></div>`;
    return;
  }

  el.innerHTML = filtrados.map(e=>`
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
      border-radius:12px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;">
      <div style="width:32px;height:32px;background:rgba(96,165,250,0.12);border-radius:8px;
        display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">📍</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;color:#f0f4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          ${escHtml(e.rua)}, nº ${escHtml(e.numero)}
        </div>
        <div style="font-size:11px;font-weight:500;color:#94a3b8;margin-top:2px;">
          ${e.count}x entregue · última taxa: ${fmt(e.taxa)}
        </div>
      </div>
    </div>
  `).join('');
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
let _toastTimer = null;
function toast(msg){
  const t=document.getElementById('toast');
  clearTimeout(_toastTimer);
  t.textContent=msg; t.classList.remove('acao'); t.classList.add('show');
  _toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}
// aviso com botão (ex.: "Desfazer")
function toastAcao(msg, rotulo, fn, ms){
  const t=document.getElementById('toast');
  clearTimeout(_toastTimer);
  t.textContent='';
  const sp=document.createElement('span'); sp.textContent=msg;
  const b=document.createElement('button'); b.className='toast-btn'; b.textContent=rotulo;
  b.onclick=()=>{ clearTimeout(_toastTimer); t.classList.remove('show','acao'); fn(); };
  t.append(sp,b); t.classList.add('show','acao');
  _toastTimer=setTimeout(()=>t.classList.remove('show','acao'), ms||6000);
}
